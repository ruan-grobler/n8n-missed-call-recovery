# Local test stack: n8n 2.44.5, Postgres, a mock Twilio API and a mock Slack plus email sink.
# Nothing here talks to the internet once the images are pulled. "npm run e2e" drives it end to end.
# Running it by hand: see .env.example. Every port binds to 127.0.0.1 only.
name: missed-call-kit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: missed_calls
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: ${KIT_DB_PASSWORD:?set KIT_DB_PASSWORD}
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit -d missed_calls"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-twilio:
    image: node:24-alpine
    command: ["node", "/app/src/mocks/server.ts", "twilio"]
    environment:
      # This number behaves like a landline: the mock answers with Twilio error 21614.
      MOCK_TWILIO_FAIL_TO: "+27000000035"
    volumes:
      - ./src/mocks:/app/src/mocks:ro
    ports:
      - "127.0.0.1:${KIT_MOCK_TWILIO_PORT:-14010}:4010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4010/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-sinks:
    image: node:24-alpine
    command: ["node", "/app/src/mocks/server.ts", "sinks"]
    volumes:
      - ./src/mocks:/app/src/mocks:ro
    ports:
      - "127.0.0.1:${KIT_MOCK_SINKS_PORT:-14020}:4020"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4020/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Imports the test credentials and the three workflows, publishes them, then exits.
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:2.44.5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:credentials --input=/seed/credentials.json &&
        n8n import:workflow --separate --input=/seed/workflows &&
        n8n publish:workflow --id=hsMissedCallCapt &&
        n8n publish:workflow --id=hsRepliesClicks1 &&
        n8n publish:workflow --id=hsDailyReport001
    environment:
      N8N_ENCRYPTION_KEY: ${KIT_N8N_ENCRYPTION_KEY:?set KIT_N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/.e2e:/seed:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.5
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mock-twilio:
        condition: service_healthy
      mock-sinks:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${KIT_N8N_ENCRYPTION_KEY:?set KIT_N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Africa/Johannesburg
      TZ: Africa/Johannesburg
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_LOG_LEVEL: info
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:${KIT_N8N_PORT:-15678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  n8n_data:
